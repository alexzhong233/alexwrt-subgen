# ACL4SSR 规则集（subconverter / OpenClash 在线转换用的就是这套）
#
# 用法：把 config.yaml 里的
#     rules_mode: inline
#     rules: rules_inline.yaml
# 换成
#     rules_mode: providers
#     rules: rules_acl4ssr.yaml
#
# 和 rules_inline.yaml 的区别：
#   · inline 是 9265 条规则全量内联，生成的 yaml 约 500 KB，客户端每次更新都要重解析
#   · 这一份只写 RULE-SET 引用，体积几 KB，规则内容由 mihomo 按 interval 拉取并缓存在本地
#   · 代价是首次启动要联网拉 30 多个文件，国内 raw.githubusercontent.com 不通，
#     所以 url 统一走 ghfast.top 加速前缀
#
# 组名和 ACL4SSR 原生配置完全一致（🎯 全球直连 / 📲 电报消息 / 🎮 游戏平台 …），
# 配套的分组定义见 config.acl4ssr.yaml，两边必须一起换。
#
# ⚠️ 顺序不能乱：ACL4SSR 是先「广告拦截 / 应用净化」再「国内直连」，最后 GEOIP,CN 兜底。
#    把广告拦截挪到 GEOIP,CN 后面会漏掉全部国内广告域名。

rule-providers:
  # ── 直连类 ────────────────────────────────────────────────
  acl-lan:
    type: http
    behavior: classical
    format: text
    url: 'https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list'
    path: ./ruleset/acl-lan.list
    interval: 86400
  acl-unban:
    type: http
    behavior: classical
    format: text
    url: 'https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list'
