rules:
  # ===== 拦截必须排在最前，否则会被后面的直连规则抢走 =====
  - 'RULE-SET,acl-banad,🛑 广告拦截'
  - 'RULE-SET,acl-banprogramad,🍃 应用净化'

  # ===== 本机/内网 =====
  - 'RULE-SET,acl-lan,🎯 全球直连'

  # ===== 大厂服务：直连优先，别浪费流量 =====
  - 'RULE-SET,acl-apple,🍎 苹果服务'
  - 'RULE-SET,acl-microsoft,Ⓜ️ 微软服务'
  - 'RULE-SET,acl-onedrive,Ⓜ️ 微软云盘'
  - 'RULE-SET,acl-bing,Ⓜ️ 微软Bing'
  - 'RULE-SET,acl-googlefcm,📢 谷歌FCM'
  - 'RULE-SET,acl-googlecn,🎯 全球直连'
  - 'RULE-SET,acl-steamcn,🎯 全球直连'

  # ===== 通讯 / AI =====
  - 'RULE-SET,acl-telegram,📲 电报消息'
  - 'RULE-SET,acl-ai,💬 Ai平台'
  - 'RULE-SET,acl-openai,💬 Ai平台'

  # ===== 游戏平台（ACL4SSR 默认直连，国内平台别走代理）=====
  - 'RULE-SET,acl-epic,🎮 游戏平台'
  - 'RULE-SET,acl-origin,🎮 游戏平台'
  - 'RULE-SET,acl-sony,🎮 游戏平台'
  - 'RULE-SET,acl-steam,🎮 游戏平台'
  - 'RULE-SET,acl-nintendo,🎮 游戏平台'

  # ===== 流媒体 =====
  - 'RULE-SET,acl-youtube,📹 油管视频'
  - 'RULE-SET,acl-netflix,🎥 奈飞视频'
  - 'RULE-SET,acl-bahamut,📺 巴哈姆特'
  - 'RULE-SET,acl-bilibilihmt,📺 哔哩哔哩'
  - 'RULE-SET,acl-bilibili,📺 哔哩哔哩'
  - 'RULE-SET,acl-neteasemusic,🎶 网易音乐'
  - 'RULE-SET,acl-chinamedia,🌏 国内媒体'
  - 'RULE-SET,acl-proxymedia,🌍 国外媒体'

  # ===== 被墙域名 =====
  - 'RULE-SET,acl-proxygfwlist,🚀 节点选择'

  # ===== 国内 IP / 域名，最后兜底直连 =====
  - 'RULE-SET,acl-chinaip,🎯 全球直连'
  - 'RULE-SET,acl-chinadomain,🎯 全球直连'
  - 'RULE-SET,acl-chinacompanyip,🎯 全球直连'
  - 'RULE-SET,acl-download,🎯 全球直连'
  - 'GEOIP,LAN,🎯 全球直连,no-resolve'
  - 'GEOIP,CN,🎯 全球直连'
  - 'MATCH,🐟 漏网之鱼'
